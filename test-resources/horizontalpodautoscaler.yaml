apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: test-horizontalpodautoscaler
  labels:
    admission-policy-test: abc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-deployment
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
