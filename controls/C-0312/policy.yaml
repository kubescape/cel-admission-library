apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubescape-c-0312-agent-sandbox-image-digests
  labels:
    controlId: C-0312
  annotations:
    controlUrl: https://kubescape.io/docs/controls/c-0312/
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - agents.x-k8s.io
      apiVersions:
      - v1beta1
      operations:
      - CREATE
      - UPDATE
      resources:
      - sandboxes
    - apiGroups:
      - extensions.agents.x-k8s.io
      apiVersions:
      - v1beta1
      operations:
      - CREATE
      - UPDATE
      resources:
      - sandboxtemplates
    - apiGroups:
      - ate.dev
      apiVersions:
      - v1alpha1
      operations:
      - CREATE
      - UPDATE
      resources:
      - workerpools
  validations:
  - expression: >-
      !['Sandbox', 'SandboxTemplate'].exists(k, object.kind == k) || (has(object.spec.podTemplate) &&
      has(object.spec.podTemplate.spec) && has(object.spec.podTemplate.spec.containers) && object.spec.podTemplate.spec.containers.all(c,
        c.image.matches('^.+@sha256:[a-f0-9]{64}$')) &&
      (!has(object.spec.podTemplate.spec.initContainers) ||
        object.spec.podTemplate.spec.initContainers.all(c,
          c.image.matches('^.+@sha256:[a-f0-9]{64}$'))))
    message: Every Agent Sandbox image must be pinned to an exact SHA-256 digest.
  - expression: >-
      object.kind != 'WorkerPool' || (has(object.spec.workerImage) && object.spec.workerImage.matches('^.+@sha256:[a-f0-9]{64}$'))
    message: WorkerPool workerImage must be pinned to an exact SHA-256 digest.
