apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubescape-c-0311-agent-sandbox-container-limits
  labels:
    controlId: C-0311
  annotations:
    controlUrl: https://kubescape.io/docs/controls/c-0311/
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["agents.x-k8s.io"]
      apiVersions: ["v1beta1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["sandboxes"]
    - apiGroups: ["extensions.agents.x-k8s.io"]
      apiVersions: ["v1beta1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["sandboxtemplates"]
  validations:
  - expression: >-
      has(object.spec.podTemplate) && has(object.spec.podTemplate.spec) &&
      has(object.spec.podTemplate.spec.containers) &&
      object.spec.podTemplate.spec.containers.all(c,
        has(c.resources) && has(c.resources.limits) &&
        'cpu' in c.resources.limits && 'memory' in c.resources.limits) &&
      (!has(object.spec.podTemplate.spec.initContainers) ||
        object.spec.podTemplate.spec.initContainers.all(c,
          has(c.resources) && has(c.resources.limits) &&
          'cpu' in c.resources.limits && 'memory' in c.resources.limits))
    message: Every Agent Sandbox container and init container must set CPU and memory limits.
