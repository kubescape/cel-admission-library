apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "kubescape-c-0055-linux-hardening"
  labels:
    controlId: "C-0055"
  annotations:
    controlUrl: "https://kubescape.io/docs/controls/c-0055/"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods", "pods/ephemeralcontainers"]
    - apiGroups:   ["apps"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["deployments","replicasets","daemonsets","statefulsets"]
    - apiGroups:   ["batch"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["jobs","cronjobs"]
  variables:
    - expression: |
        object.kind == 'Pod'
          ? object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
          : object.kind in ['Deployment','ReplicaSet','DaemonSet','StatefulSet','Job']
            ? object.spec.template.spec.containers + (has(object.spec.template.spec.initContainers) ? object.spec.template.spec.initContainers : []) + (has(object.spec.template.spec.ephemeralContainers) ? object.spec.template.spec.ephemeralContainers : [])
            : object.kind == 'CronJob'
              ? object.spec.jobTemplate.spec.template.spec.containers + (has(object.spec.jobTemplate.spec.template.spec.initContainers) ? object.spec.jobTemplate.spec.template.spec.initContainers : []) + (has(object.spec.jobTemplate.spec.template.spec.ephemeralContainers) ? object.spec.jobTemplate.spec.template.spec.ephemeralContainers : [])
              : []
      name: containers
  validations:
    - expression: >
        object.kind != 'Pod' ||
        (has(object.metadata.annotations) && object.metadata.annotations.exists(annotation, annotation.startsWith("container.apparmor.security.beta.kubernetes.io"))) ||
        (has(object.spec.securityContext) && (has(object.spec.securityContext.seccompProfile) || has(object.spec.securityContext.seLinuxOptions) || has(object.spec.securityContext.appArmorProfile))) ||
        variables.containers.all(container, has(container.securityContext) && (has(container.securityContext.seccompProfile) ||
        has(container.securityContext.seLinuxOptions) ||
        has(container.securityContext.appArmorProfile) ||
        (has(container.securityContext.capabilities) && has(container.securityContext.capabilities.drop))))
      message: "Pods could have more security hardening! (see more at https://kubescape.io/docs/controls/c-0055/)"
    - expression: >
        ['Deployment','ReplicaSet','DaemonSet','StatefulSet','Job'].all(kind, object.kind != kind) ||
        (has(object.spec.template.metadata) && has(object.spec.template.metadata.annotations) && object.spec.template.metadata.annotations.exists(annotation, annotation.startsWith("container.apparmor.security.beta.kubernetes.io"))) ||
        (has(object.spec.template.spec.securityContext) && (has(object.spec.template.spec.securityContext.seccompProfile) || has(object.spec.template.spec.securityContext.seLinuxOptions) || has(object.spec.template.spec.securityContext.appArmorProfile))) ||
        variables.containers.all(container, has(container.securityContext) && (has(container.securityContext.seccompProfile) ||
        has(container.securityContext.seLinuxOptions) ||
        has(container.securityContext.appArmorProfile) ||
        (has(container.securityContext.capabilities) && has(container.securityContext.capabilities.drop))))
      message: "Workloads could have more security hardening! (see more at https://kubescape.io/docs/controls/c-0055/)"
    - expression: >
        object.kind != 'CronJob' ||
        (has(object.spec.jobTemplate.spec.template.metadata) && has(object.spec.jobTemplate.spec.template.metadata.annotations) && object.spec.jobTemplate.spec.template.metadata.annotations.exists(annotation, annotation.startsWith("container.apparmor.security.beta.kubernetes.io"))) ||
        (has(object.spec.jobTemplate.spec.template.spec.securityContext) && (has(object.spec.jobTemplate.spec.template.spec.securityContext.seccompProfile) || has(object.spec.jobTemplate.spec.template.spec.securityContext.seLinuxOptions) || has(object.spec.jobTemplate.spec.template.spec.securityContext.appArmorProfile))) ||
        variables.containers.all(container, has(container.securityContext) && (has(container.securityContext.seccompProfile) ||
        has(container.securityContext.seLinuxOptions) ||
        has(container.securityContext.appArmorProfile) ||
        (has(container.securityContext.capabilities) && has(container.securityContext.capabilities.drop))))
      message: "CronJob could have more security hardening! (see more at https://kubescape.io/docs/controls/c-0055/)"
