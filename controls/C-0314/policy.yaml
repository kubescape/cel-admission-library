apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubescape-c-0314-agent-sandbox-managed-networking
  labels:
    controlId: C-0314
  annotations:
    controlUrl: https://kubescape.io/docs/controls/c-0314/
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["extensions.agents.x-k8s.io"]
      apiVersions: ["v1beta1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["sandboxtemplates"]
  validations:
  - expression: >-
      !has(object.spec.networkPolicyManagement) || object.spec.networkPolicyManagement == null ||
      object.spec.networkPolicyManagement == 'Managed'
    message: SandboxTemplate must use managed networking. The managed default blocks private and internal destinations but still permits public internet.
