apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "kubescape-c-0199-deny-net-raw-capability"
  labels:
    controlId: "C-0199"
  annotations:
    controlUrl: "https://kubescape.io/docs/controls/c-0199/"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods", "pods/ephemeralcontainers"]
    - apiGroups:   ["apps"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["deployments","replicasets","daemonsets","statefulsets"]
    - apiGroups:   ["batch"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["jobs","cronjobs"]
  validations:
    # Capability names are matched case-insensitively, because containerd and CRI-O both
    # upper-case them. On the add side CAP_NET_RAW is denied too: CRI-O keeps a name that
    # already starts with CAP_, so it grants NET_RAW there. On the drop side only NET_RAW
    # and ALL count: containerd puts CAP_ in front of every name, so dropping CAP_NET_RAW
    # drops nothing there and the container keeps NET_RAW from the default set.
    - expression: "object.kind != 'Pod' || (object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])).all(container, has(container.securityContext) && has(container.securityContext.capabilities) && has(container.securityContext.capabilities.drop) && container.securityContext.capabilities.drop.exists(c, c.upperAscii() == 'NET_RAW' || c.upperAscii() == 'ALL') && (!has(container.securityContext.capabilities.add) || container.securityContext.capabilities.add.all(cap, cap.upperAscii() != 'NET_RAW' && cap.upperAscii() != 'CAP_NET_RAW' && cap.upperAscii() != 'ALL')))"
      message: "Container must drop the NET_RAW capability (or all capabilities) and must not add NET_RAW back! (see more at https://kubescape.io/docs/controls/c-0199/)"
    - expression: "['Deployment','ReplicaSet','DaemonSet','StatefulSet','Job'].all(kind, object.kind != kind) || (object.spec.template.spec.containers + (has(object.spec.template.spec.initContainers) ? object.spec.template.spec.initContainers : []) + (has(object.spec.template.spec.ephemeralContainers) ? object.spec.template.spec.ephemeralContainers : [])).all(container, has(container.securityContext) && has(container.securityContext.capabilities) && has(container.securityContext.capabilities.drop) && container.securityContext.capabilities.drop.exists(c, c.upperAscii() == 'NET_RAW' || c.upperAscii() == 'ALL') && (!has(container.securityContext.capabilities.add) || container.securityContext.capabilities.add.all(cap, cap.upperAscii() != 'NET_RAW' && cap.upperAscii() != 'CAP_NET_RAW' && cap.upperAscii() != 'ALL')))"
      message: "Workload has a container that must drop the NET_RAW capability (or all capabilities) and must not add NET_RAW back! (see more at https://kubescape.io/docs/controls/c-0199/)"
    - expression: "object.kind != 'CronJob' || (object.spec.jobTemplate.spec.template.spec.containers + (has(object.spec.jobTemplate.spec.template.spec.initContainers) ? object.spec.jobTemplate.spec.template.spec.initContainers : []) + (has(object.spec.jobTemplate.spec.template.spec.ephemeralContainers) ? object.spec.jobTemplate.spec.template.spec.ephemeralContainers : [])).all(container, has(container.securityContext) && has(container.securityContext.capabilities) && has(container.securityContext.capabilities.drop) && container.securityContext.capabilities.drop.exists(c, c.upperAscii() == 'NET_RAW' || c.upperAscii() == 'ALL') && (!has(container.securityContext.capabilities.add) || container.securityContext.capabilities.add.all(cap, cap.upperAscii() != 'NET_RAW' && cap.upperAscii() != 'CAP_NET_RAW' && cap.upperAscii() != 'ALL')))"
      message: "CronJob has a container that must drop the NET_RAW capability (or all capabilities) and must not add NET_RAW back! (see more at https://kubescape.io/docs/controls/c-0199/)"
